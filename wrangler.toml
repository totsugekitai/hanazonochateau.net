name = "hanazonochateau-worker"
pages_build_output_dir = "./public"
compatibility_date = "2026-08-20"

[build]
command = "git fetch --unshallow && npm ci && ./gen_575_data.sh && hugo --gc --minify"

[env.production]
r2_buckets = [ 
    { binding = "DATA", bucket_name = "hanazonochateau" }
]

[env.production.vars]
HUGO_VERSION = "0.165"
NODE_VERSION = "26"
SKIP_DEPENDENCY_INSTALL = "true"

[env.preview]
r2_buckets = [ 
    { binding = "DATA", bucket_name = "hanazonochateau" }
]

[env.preview.vars]
HUGO_BASEURL = "/"
HUGO_VERSION = "0.165"
NODE_VERSION = "26"
SKIP_DEPENDENCY_INSTALL = "true"
